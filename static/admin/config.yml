# Sveltia CMS — Danka Studios
# See https://sveltiacms.app/en/docs for the full config reference.

backend:
  name: github
  repo: abhiramjois/danka-website
  branch: main
  # Uncomment & add a personal access token if your repo is private:
  # auth_scope: repo

# Where uploaded media is stored (relative to the repo root) & the URL it maps to.
media_folder: /static/images
public_folder: /images

# Optional: enable web UI entry points to preview deployed site
site_url: https://dankastudios.com
display_url: https://dankastudios.com
logo_url: /images/channel-fallback.svg

collections:
  # ---------------- Pages (single files) ----------------
  - name: pages
    label: Pages
    description: Global page copy that matches the landing page design.
    files:
      - name: home
        label: Home
        file: content/pages/home.md
        fields:
          - { name: hero_title, label: Hero title, widget: string, default: "An art collective" }
          - { name: tagline, label: Tagline, widget: string, default: "Short films | Theatre | Music" }
          - { name: description, label: Hero description, widget: text, required: false }
          - { name: youtube_title, label: YouTube section text, widget: string, default: "We have begun our journey with the Youtube channel Danka studios." }
          - { name: cta_title, label: CTA title, widget: string, default: "Have a story to tell?" }
          - { name: cta_description, label: CTA description, widget: text, required: false }
          - { name: collab_title, label: Collaboration section title, widget: string, default: "What we do" }
          - { name: collab_description, label: Collaboration section description, widget: text, required: false }
          - { name: about_title, label: Team section title, widget: string, default: "About our team" }
          - { name: about_description, label: Team section description, widget: text, required: false }
          - { name: stats_subscribers, label: "Subscribers (fallback when YouTube API is off)", widget: string, default: "4,530" }
          - { name: stats_videos, label: "Videos (fallback)", widget: string, default: "72" }
          - { name: stats_views, label: "Views (fallback)", widget: string, default: "700K" }
          - { name: data_updated_note, label: "Data note (optional)", widget: string, required: false }
      - name: folio
        label: Folio page
        file: content/pages/folio.md
        fields:
          - { name: title, label: Page title, widget: string, default: "Folio" }
          - { name: description, label: Page description, widget: text, required: false }
      - name: people
        label: People page
        file: content/pages/people.md
        fields:
          - { name: title, label: Page title, widget: string, default: "People" }
          - { name: description, label: Page description, widget: text, required: false }
      - name: collaborate
        label: Collaborate page
        file: content/pages/collaborate.md
        fields:
          - { name: title, label: Page title, widget: string, default: "Collaborate" }
          - { name: description, label: Page description, widget: text, required: false }

  # ---------------- Folio ----------------
  - name: folio
    label: Folio
    label_singular: Folio item
    description: Portfolio projects — title, linked URL, rich description, cover, posters and screengrabs.
    folder: content/folio
    extension: md
    create: true
    slug: "{{slug}}"
    path: "{{slug}}"
    media_folder: /static/images
    public_folder: /images
    fields:
      - { name: title, label: Title, widget: string, hint: "Used to build the page slug automatically." }
      - { name: url, label: Linked URL, widget: string, hint: "Where the project lives (YouTube, Vimeo, website…)." }
      - { name: tags, label: Tags, widget: list, required: false, field: { name: tag, label: Tag, widget: string } }
      - { name: director, label: Director, widget: string, required: false }
      - { name: writer, label: Writer, widget: string, required: false }
      - name: cast_crew
        label: Cast & Crew
        widget: list
        required: false
        hint: "Anyone credited on the project. 1 role = 1 entry."
        fields:
          - { name: role, label: Role, widget: string, hint: "e.g. Cast, Director of Photography, Sound…" }
          - { name: name, label: Name, widget: string }
      - name: cover
        label: Cover image
        widget: image
        required: false
        hint: "Large image shown at the top of the project page and on the folio card."
      - name: posters
        label: Posters / Thumbnails
        widget: list
        required: false
        hint: "Poster and thumbnail images."
        field: { name: image, label: Image, widget: image }
      - name: screengrabs
        label: Screengrabs
        widget: list
        required: false
        hint: "Frames or screengrabs from the project."
        field: { name: image, label: Image, widget: image }
      - { name: body, label: Description, widget: markdown, hint: "Rich text description of the project." }

  # ---------------- People ----------------
  - name: people
    label: People
    label_singular: Person
    description: Team members — name, profile photo, bio and roles.
    folder: content/people
    extension: md
    create: true
    slug: "{{slug}}"
    path: "{{slug}}"
    media_folder: /static/images
    public_folder: /images
    fields:
      - { name: name, label: Name, widget: string, hint: "Used to build the page slug automatically." }
      - { name: photo, label: Profile photo, widget: image }
      - { name: roles, label: Roles, widget: list, required: false, field: { name: role, label: Role, widget: string }, hint: "e.g. Filmmaker, Director, Writer…" }
      - { name: body, label: Bio, widget: markdown }

  # ---------------- Collaborations ----------------
  - name: collaborations
    label: Collaborations
    label_singular: Collaboration
    description: Collaboration types — each links to a Folio project.
    folder: content/collaborations
    extension: md
    create: true
    slug: "{{slug}}"
    path: "{{slug}}"
    media_folder: /static/images
    public_folder: /images
    fields:
      - { name: title, label: Collab type, widget: string, hint: "e.g. Short films, Theatre, Music, Ad campaigns. Used to build the page slug automatically." }
      - { name: subtitle, label: Sub-type (optional), widget: string, required: false, hint: "e.g. Web series, Plays, Production, for Brands — shown on the home grid." }
      - { name: image, label: Cover image, widget: image, required: false, hint: "Shown on the home grid and the collaboration page." }
      - name: folio
        label: Linked folio project
        widget: relation
        collection: folio
        value_field: "{{slug}}"
        display_fields: [title]
        search_fields: [title]
        hint: "Pick a Folio item to feature as related work."
      - { name: url, label: External URL (optional), widget: string, required: false }
      - { name: body, label: Description, widget: markdown }